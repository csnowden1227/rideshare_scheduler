<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rental Operations</title>
  <style>
    :root{--primary:#082f49;--secondary:#0f766e;--accent:#ecfeff;--ink:#13251f;--muted:#63746c;--line:#d8e2dc;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,var(--accent),transparent 32%),#f4f6f2;color:var(--ink);font-family:"Trebuchet MS",sans-serif}.shell{max-width:1420px;margin:auto;padding:28px 20px 70px}.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--secondary)}h1{font:clamp(38px,6vw,70px)/.95 Georgia,serif;letter-spacing:-.045em;margin:8px 0 0}.refresh{border:0;border-radius:14px;padding:13px 17px;background:var(--primary);color:#fff;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:25px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.stat span{display:block;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.stat strong{display:block;font:34px Georgia,serif;margin-top:7px}.stat.danger strong{color:var(--danger)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.filter.active{background:var(--secondary);color:#fff;border-color:var(--secondary)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:19px;box-shadow:0 14px 32px rgba(18,48,38,.06)}.card.overdue{border-color:#f0a79d;background:#fffafa}.head{display:flex;justify-content:space-between;gap:12px}.head h2{font:23px Georgia,serif;margin:0}.pill{height:max-content;padding:7px 9px;border-radius:999px;background:var(--accent);color:var(--secondary);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.overdue .pill{background:#fee4e2;color:var(--danger)}.meta{display:grid;gap:10px;margin:16px 0}.row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #edf1ee;padding-bottom:9px}.row span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.row strong{text-align:right;font-size:13px}.estimate{background:var(--accent);border-radius:16px;padding:13px;margin-top:12px}.estimate strong{display:block;font:28px Georgia,serif;color:var(--primary)}.overdue .estimate{background:#fff0ed}.actions{display:flex;gap:9px;margin-top:15px}.button{flex:1;text-align:center;text-decoration:none;border-radius:13px;padding:12px;background:var(--primary);color:#fff;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.empty,.error{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:35px;text-align:center}.error{color:var(--danger)}.updated{font-size:12px;color:var(--muted);margin:10px 0 20px}@media(max-width:1050px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.mast{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main class="shell"><header class="mast"><div><div class="eyebrow">Rental staff workspace</div><h1 id="title">Rental Operations</h1></div><button id="refresh" class="refresh">Refresh rentals</button></header><div id="updated" class="updated">Loading current rentals...</div><section class="stats"><div class="stat"><span>Reserved</span><strong id="count-reserved">0</strong></div><div class="stat"><span>Checked out</span><strong id="count-active">0</strong></div><div class="stat danger"><span>Overdue</span><strong id="count-overdue">0</strong></div><div class="stat"><span>Awaiting verification</span><strong id="count-returned">0</strong></div><div class="stat"><span>Verified</span><strong id="count-verified">0</strong></div></section><nav class="toolbar" id="filters"></nav><div id="error" class="error"></div><div id="empty" class="empty">No rentals match this view.</div><section id="rentals" class="grid"></section></main>
  <script>
    const query=new URLSearchParams(location.search);const locationId=String(query.get('location_id')||'').trim();const token=String(query.get('token')||'').trim();let records=[],filter='attention';const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v||0));const dateTime=v=>v?new Date(v).toLocaleString():'Not recorded';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function filtered(){if(filter==='all')return records;if(filter==='attention')return records.filter(r=>['active','overdue','returned'].includes(r.lifecycle_status));return records.filter(r=>r.lifecycle_status===filter)}
    function renderFilters(){const options=[['attention','Needs attention'],['reserved','Reserved'],['active','Checked out'],['overdue','Overdue'],['returned','Awaiting verification'],['verified','Verified'],['all','All']];document.getElementById('filters').innerHTML=options.map(([key,label])=>`<button class="filter ${key===filter?'active':''}" data-filter="${key}">${label}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;render()})}
    function render(){['reserved','active','overdue','returned','verified'].forEach(status=>document.getElementById(`count-${status}`).textContent=records.filter(r=>r.lifecycle_status===status).length);renderFilters();const rows=filtered();document.getElementById('empty').style.display=rows.length?'none':'block';document.getElementById('rentals').innerHTML=rows.map(r=>{const closeout=new URL('/rental-closeout.html',location.origin);closeout.searchParams.set('location_id',locationId);closeout.searchParams.set('booking_id',r.booking_id);closeout.searchParams.set('token',token);return `<article class="card ${r.lifecycle_status==='overdue'?'overdue':''}"><div class="head"><h2>${esc(`${r.first_name||''} ${r.last_name||''}`.trim()||`Booking ${r.booking_id}`)}</h2><span class="pill">${esc(r.lifecycle_status.replaceAll('_',' '))}</span></div><div class="meta"><div class="row"><span>Vehicle</span><strong>${esc(r.vehicle_type||r.vehicle_slot_id)}</strong></div><div class="row"><span>Pickup</span><strong>${esc(dateTime(r.start_time))}</strong></div><div class="row"><span>Scheduled return</span><strong>${esc(dateTime(r.scheduled_return_at))}</strong></div><div class="row"><span>Actual return</span><strong>${esc(dateTime(r.customer_returned_at))}</strong></div><div class="row"><span>Customer</span><strong>${esc(r.customer_phone||r.customer_email||'Not provided')}</strong></div></div><div class="estimate"><span>${r.estimate_is_live?'Live estimated overage':'Recorded overage'}</span><strong>${esc(money(r.amount))}</strong><small>${esc(String(r.billableMinutes||0))} billable minutes at ${esc(money(r.overageHourlyRate))}/hour</small></div><div class="actions"><a class="button" href="${esc(closeout.toString())}">${r.lifecycle_status==='reserved'?'Check out vehicle':r.lifecycle_status==='returned'?'Verify return':'Open closeout'}</a></div></article>`}).join('')}
    async function load(){const error=document.getElementById('error');error.style.display='none';try{const response=await fetch(`/api/rental-operations?location_id=${encodeURIComponent(locationId)}&token=${encodeURIComponent(token)}`,{headers:{'X-Rental-Operator-Token':token},cache:'no-store'});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Rental operations access failed.');records=data.rentals||[];const brand=data.branding||{};if(brand.business_name){document.title=`${brand.business_name} Rental Operations`;document.getElementById('title').textContent=`${brand.business_name} Rentals`}if(brand.brand_color_primary)document.documentElement.style.setProperty('--primary',brand.brand_color_primary);if(brand.brand_color_secondary)document.documentElement.style.setProperty('--secondary',brand.brand_color_secondary);if(brand.brand_color_accent)document.documentElement.style.setProperty('--accent',brand.brand_color_accent);document.getElementById('updated').textContent=`Live data refreshed ${new Date(data.server_time).toLocaleTimeString()}. This page refreshes every 30 seconds.`;render()}catch(err){error.textContent=err.message;error.style.display='block'}}
    document.getElementById('refresh').onclick=load;if(!locationId||!token){document.getElementById('error').textContent='This dashboard link is incomplete. Copy it again from the Rental Setup Wizard.';document.getElementById('error').style.display='block'}else{load();setInterval(load,30000)}
  </script>
</body></html>
