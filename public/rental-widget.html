<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luxury Rental Booking</title>
  <style>
    :root{--primary:#082f49;--secondary:#0f766e;--accent:#ecfeff;--ink:#14231f;--line:#d8e2dc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,var(--accent),#fff 48%,#f2f0e8);color:var(--ink);font-family:"Trebuchet MS",sans-serif}.shell{max-width:1120px;margin:auto;padding:26px 18px 50px}.hero{position:relative;overflow:hidden;border-radius:30px;padding:30px;color:#fff;background:linear-gradient(125deg,var(--primary),var(--secondary));box-shadow:0 25px 60px rgba(15,35,28,.16)}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(255,255,255,.25);border-radius:50%;right:-55px;top:-85px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.brand img{width:44px;height:44px;object-fit:contain;border-radius:12px;background:#fff}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,62px);line-height:.98;letter-spacing:-.04em;max-width:720px;margin:26px 0 12px}.hero p{max-width:680px;line-height:1.7;color:rgba(255,255,255,.86)}.content{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:30px;padding:24px;margin-top:18px}.vehicle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.vehicle{border:2px solid transparent;border-radius:22px;background:#f7f9f6;overflow:hidden;cursor:pointer;transition:.2s}.vehicle.selected{border-color:var(--secondary);box-shadow:0 12px 28px rgba(15,118,110,.15)}.vehicle img{display:block;width:100%;height:170px;object-fit:cover;background:#dfe7e1}.vehicle-copy{padding:15px}.vehicle h3{font-family:Georgia,serif;font-size:21px;margin:0}.vehicle p{font-size:12px;line-height:1.6;color:#63746d;margin:8px 0}.rate{font-weight:900;color:var(--secondary)}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#53665e;margin:0 0 7px}.field input{width:100%;border:1px solid #cbd8d0;border-radius:13px;padding:13px;background:#fff;font:14px "Trebuchet MS",sans-serif}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:14px;padding:13px 18px;min-height:48px;font-weight:900;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:var(--accent);color:var(--primary)}.notice,.error,.quote{margin-top:16px;border-radius:16px;padding:14px;font-size:13px;line-height:1.65}.notice{background:#f5f7f2;color:#53665e}.error{display:none;background:#fff0ed;color:#9b321c;border:1px solid #f4c1b6}.quote{display:none;background:var(--accent);border:1px solid #b9ded0}.quote strong{font-size:24px;color:var(--primary)}.terms{display:none;margin-top:16px;font-size:12px;line-height:1.65;color:#53665e}.terms label{display:flex;gap:10px;align-items:flex-start}.terms input{margin-top:3px}.empty{padding:50px 20px;text-align:center;color:#7a3421}.loading{text-align:center;padding:80px 20px;font-weight:900}@media(max-width:820px){.vehicle-grid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.vehicle-grid,.form{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:24px}.content{padding:17px}}
  </style>
</head>
<body><main id="app" class="shell"><div class="loading">Loading rental collection...</div></main>
  <script>
    const query=new URLSearchParams(location.search);const locationId=String(query.get('loc')||'').trim();let config=null,account=null,selected=null,quote=null;
    const money=value=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(value||0));
    function resize(){if(query.get('embed')==='1')parent.postMessage({type:'rental-widget-height',height:document.documentElement.scrollHeight},'*')};new ResizeObserver(resize).observe(document.body);
    function vehicleName(v){return [v.vehicle_year,v.vehicle_make,v.vehicle_model].filter(Boolean).join(' ')||v.vehicle_type}
    function showError(message){const el=document.getElementById('error');if(!el)return;el.textContent=message||'';el.style.display=message?'block':'none'}
    async function json(url,options={}){const res=await fetch(url,{credentials:'include',...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Request failed.');return data}
    async function loadAccount(){try{const data=await json('/api/customer-account/session');if(String(data.account?.location_id||'')===locationId)account=data.account}catch{account=null}}
    function render(){const b=config.branding||{};document.documentElement.style.setProperty('--primary',b.primary);document.documentElement.style.setProperty('--secondary',b.secondary);document.documentElement.style.setProperty('--accent',b.accent);document.title=`${b.business_name} Rentals`;const vehicles=config.vehicles||[];document.getElementById('app').innerHTML=`<section class="hero"><div class="brand">${b.business_logo?`<img src="${b.business_logo}" alt="">`:''}<span>${b.business_name}</span></div><h1>${config.headline}</h1><p>${config.intro_text}</p></section><section class="content">${vehicles.length?`<div class="vehicle-grid">${vehicles.map(v=>`<article class="vehicle" data-id="${v.vehicle_slot_id}">${v.image?`<img src="${v.image}" alt="${vehicleName(v)}">`:'<div style="height:170px;background:linear-gradient(135deg,var(--accent),#d7e2dc)"></div>'}<div class="vehicle-copy"><h3>${vehicleName(v)}</h3><p>${v.description||v.vehicle_type}</p><div class="rate">${money(v.hourly_rate)}/hour · ${v.minimum_hours}-hour minimum</div></div></article>`).join('')}</div><div class="form"><div class="field"><label>Pickup date and time</label><input id="start" type="datetime-local"></div><div class="field"><label>Rental hours</label><input id="hours" type="number" min="1" value="4"></div><div class="field full"><label>Pickup / return location</label><input id="pickup" placeholder="Rental pickup address or instructions"></div></div><div class="notice">Drivers must be at least ${config.minimum_age}. Returns include a ${config.grace_minutes}-minute grace period. Overage is billed by the minute at ${config.overage_multiplier}× the booked hourly rate.</div><div id="error" class="error"></div><div id="quote" class="quote"></div><div id="terms" class="terms"><label><input id="accept" type="checkbox"><span>${config.terms_text} I authorize this business to save my payment method and charge approved rental extensions and verified overage.</span></label></div><div class="actions"><button id="calculate" class="btn secondary">Calculate rental</button><button id="book" class="btn primary">${account?'Continue to secure checkout':'Sign in to book'}</button></div>`:'<div class="empty">Rental vehicles are being prepared. Please check back soon.</div>'}</section>`;document.querySelectorAll('.vehicle').forEach(card=>card.onclick=()=>{document.querySelectorAll('.vehicle').forEach(x=>x.classList.remove('selected'));card.classList.add('selected');selected=vehicles.find(v=>v.vehicle_slot_id===card.dataset.id);document.getElementById('hours').min=selected.minimum_hours;document.getElementById('hours').value=Math.max(Number(document.getElementById('hours').value||0),selected.minimum_hours);quote=null});document.getElementById('calculate')?.addEventListener('click',calculate);document.getElementById('book')?.addEventListener('click',book);if(vehicles.length)document.querySelector('.vehicle').click()}
    async function calculate(){showError('');if(!selected)return showError('Select a rental vehicle.');const start=document.getElementById('start').value;const hours=Number(document.getElementById('hours').value||0);try{quote=await json('/api/rental-widget/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({location_id:locationId,vehicle_slot_id:selected.vehicle_slot_id,start_time:new Date(start).toISOString(),hourly_hours:hours})});const el=document.getElementById('quote');el.innerHTML=`<strong>${money(quote.total)}</strong><br>${quote.pricing_label}<br>Tax: ${money(quote.tax_amount)} · Due now: ${money(quote.amount_due_now)}`;el.style.display='block';document.getElementById('terms').style.display='block'}catch(error){showError(error.message)}}
    function safeAttribute(value){return String(value||'').replace(/[&"<>]/g,char=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[char]))}
    function prepareGuestCheckout(){const form=document.querySelector('.form');if(!form||document.getElementById('first-name'))return;form.insertAdjacentHTML('afterbegin',`<div class="field"><label>First name</label><input id="first-name" autocomplete="given-name" value="${safeAttribute(account?.first_name)}"></div><div class="field"><label>Last name</label><input id="last-name" autocomplete="family-name" value="${safeAttribute(account?.last_name)}"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" value="${safeAttribute(account?.email)}"></div><div class="field"><label>Mobile phone</label><input id="phone" type="tel" autocomplete="tel" value="${safeAttribute(account?.phone)}"></div>`);const oldButton=document.getElementById('book');const newButton=oldButton.cloneNode(true);newButton.textContent='Continue to secure checkout';oldButton.replaceWith(newButton);newButton.addEventListener('click',bookRentalWithoutLogin);const notice=document.querySelector('.notice');if(notice)notice.insertAdjacentText('beforeend',' Card details are entered securely during checkout and saved for approved extensions and verified overage.')}
    async function bookRentalWithoutLogin(){if(!quote)await calculate();if(!quote)return;if(!document.getElementById('accept').checked)return showError('Accept the rental and saved-card terms to continue.');const customer={first_name:document.getElementById('first-name').value.trim(),last_name:document.getElementById('last-name').value.trim(),email:document.getElementById('email').value.trim(),phone:document.getElementById('phone').value.trim()};if(!customer.first_name||!customer.last_name||!customer.email||!customer.phone)return showError('Enter your first name, last name, email, and mobile phone.');const start=document.getElementById('start').value;const payload={location_id:locationId,vehicle_slot_id:selected.vehicle_slot_id,...customer,pickup_address:document.getElementById('pickup').value||'Rental pickup',dropoff_address:document.getElementById('pickup').value||'Rental return',start_time:new Date(start).toISOString(),start_time_local:start,booking_mode:'rental',selected_hourly_booking:selected.vehicle_slot_id,hourly_hours:quote.hourly_hours,accepted_terms:true,card_on_file_consent:true,payment_choice:quote.deposit_eligible?'deposit':'full',...quote,return_url:location.href};try{const result=await json('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(result.checkout_url){if(query.get('embed')==='1'&&window.top!==window)window.top.location.href=result.checkout_url;else location.href=result.checkout_url}else showError(result.message||'Your rental request was saved.')}catch(error){showError(error.message)}}
    async function finalizeRentalCheckout(){if(query.get('checkout')!=='success'||!query.get('session_id'))return false;document.getElementById('app').innerHTML='<div class="loading">Confirming your rental payment...</div>';const data=await json(`/api/checkout-session-status?session_id=${encodeURIComponent(query.get('session_id'))}&location_id=${encodeURIComponent(locationId)}`);if(!data.paid)throw new Error('Payment has not been completed yet.');const bookingId=data.booking?.booking_id||query.get('booking_id')||'';document.getElementById('app').innerHTML=`<section class="content" style="text-align:center"><h1>Rental confirmed</h1><p>Your payment was received and booking ${bookingId} is confirmed.</p><div class="actions" style="justify-content:center"><a class="btn primary" href="/customer-dashboard?location_id=${encodeURIComponent(locationId)}" style="text-decoration:none">Open customer portal</a></div></section>`;return true}
    (async()=>{try{if(!locationId)throw new Error('Rental link is missing its location.');[config]=await Promise.all([json(`/api/rental-widget/${encodeURIComponent(locationId)}`),loadAccount()]);if(await finalizeRentalCheckout())return;render();prepareGuestCheckout();if(query.get('checkout')==='cancel')showError('Checkout was canceled. Your card was not charged.')}catch(error){document.getElementById('app').innerHTML=`<div class="empty"><h2>Rental booking unavailable</h2><p>${error.message}</p></div>`}})();
  </script>
</body></html>
